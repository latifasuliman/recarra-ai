<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Recarra Back Office</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0e1c2f;
      --fg: #142033;
      --muted: #5b6b7c;
      --bg: #f4f6f8;
      --surface: #fff;
      --accent: #168a46;
      --border: #d7dee6;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.25rem;
      background: var(--navy);
      color: #fff;
    }
    header a { color: #fff; text-decoration: none; font-weight: 700; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 860px) { .grid { grid-template-columns: 320px 1fr; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .lead {
      width: 100%;
      text-align: left;
      border: 0;
      background: var(--bg);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      font: inherit;
    }
    .lead.active { outline: 2px solid var(--navy); }
    .muted { color: var(--muted); font-size: 0.88rem; }
    label { display: block; font-size: 0.78rem; font-weight: 700; margin: 0.7rem 0 0.3rem; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .btn {
      min-height: 44px;
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-ghost {
      background: #fff;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .chat { max-height: 280px; overflow: auto; background: var(--bg); border-radius: 8px; padding: 0.75rem; }
    .bubble { margin: 0.4rem 0; padding: 0.55rem 0.7rem; border-radius: 8px; background: #fff; max-width: 90%; }
    .bubble.recarra { background: var(--navy); color: #fff; margin-left: auto; }
    h1, h2 { letter-spacing: -0.03em; margin: 0 0 0.4rem; }
  </style>
</head>
<body>
  <header>
    <strong>Recarra Back Office</strong>
    <a href="./">Site</a>
  </header>
  <main>
    <p class="muted">Secret desk. Offers from this GitHub site land here. Change status to send the customer home. Chat is live on their tracking page.</p>
    <div class="grid">
      <aside class="card">
        <h2>Leads</h2>
        <input id="deskSearch" placeholder="Search RC-4821 or phone" style="margin:0.4rem 0 0.8rem" />
        <div id="list"></div>
      </aside>
      <section class="card" id="detail">
        <p class="muted">Pick a lead.</p>
      </section>
    </div>
  </main>
  <script>
    const KEY = "recarra-leads-v1";
    const STATUSES = ["New Lead","Contacted","Vehicle Information Needed","Offer Calculated","Offer Sent","Negotiating","Offer Accepted","Pickup Scheduled","Vehicle Collected","Buyer Paid","Completed","Lost or Rejected"];
    const CLOSED = ["Buyer Paid","Completed","Lost or Rejected"];
    let selected = null;
    let filter = "";

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
      catch { return []; }
    }
    function save(leads) { localStorage.setItem(KEY, JSON.stringify(leads)); }
    function money(n) { return "$" + Number(n || 0).toLocaleString(); }
    function leads() { return load(); }
    function get(id) { return leads().find((l) => l.id === id); }
    function patch(id, next) {
      save(leads().map((l) => l.id === id ? Object.assign({}, l, next) : l));
    }

    function renderList() {
      const box = document.getElementById("list");
      const q = filter.trim().toUpperCase();
      const qDigits = filter.replace(/\D/g, "");
      const items = leads().filter((l) => {
        if (!q) return true;
        const blob = (l.id + " " + (l.trackCode || "") + " " + l.name + " " + l.phone + " " + l.year + " " + l.make + " " + l.model).toUpperCase();
        return blob.indexOf(q) !== -1 || (qDigits && String(l.phone).replace(/\D/g, "").indexOf(qDigits) !== -1);
      });
      if (!items.length) {
        box.innerHTML = "<p class='muted'>No offers match.</p>";
        return;
      }
      box.innerHTML = items.map((l) =>
        "<button class='lead" + (selected === l.id ? " active" : "") + "' data-id='" + l.id + "'>" +
        "<strong>" + (l.trackCode || l.id) + "</strong> · " + l.year + " " + l.make + " " + l.model + "<br>" +
        "<span class='muted'>" + l.status + (l.keepOrAssign === "assign" ? (l.assignmentPaidAt ? " · ASSIGNED/PAID" : " · ASSIGN") : "") + " · " + l.name + "</span></button>"
      ).join("");
      box.querySelectorAll(".lead").forEach((btn) => {
        btn.onclick = () => { selected = btn.dataset.id; render(); };
      });
    }

    function renderDetail() {
      const l = get(selected);
      const box = document.getElementById("detail");
      if (!l) { box.innerHTML = "<p class='muted'>Pick a lead.</p>"; return; }
      const msgs = l.messages || [];
      const track = l.trackCode || l.id;
      const root = location.origin + location.pathname.replace(/[^/]+$/, "");
      const href = root + "track.html?code=" + encodeURIComponent(track);
      const letterHref = root + "letter.html?code=" + encodeURIComponent(track);
      box.innerHTML =
        "<p class='muted'>" + (l.trackCode || l.id) + "</p>" +
        "<h1>" + l.year + " " + l.make + " " + l.model + "</h1>" +
        "<p class='muted'>" + l.name + " · " + l.phone + (l.email ? " · " + l.email : "") + " · " + l.zip + "</p>" +
        "<p>Starting range <strong>" + money(l.offerLow) + "–" + money(l.offerHigh) + "</strong></p>" +
        "<p class='muted'>Customer tracking: <a href='" + href + "' target='_blank' rel='noopener'>" + href + "</a></p>" +
        "<p class='muted'>Offer letter: <a href='" + letterHref + "' target='_blank' rel='noopener'>" + letterHref + "</a></p>" +
        "<label>Status (this is how you send them home)</label>" +
        "<select id='status'>" + STATUSES.map((s) => "<option" + (s === l.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select>" +
        "<p class='muted'>" + (CLOSED.includes(l.status) ? "Deal closed — customer can return to the main site." : "Customer stays on tracking until you set Paid, Completed, or Lost.") + "</p>" +
        "<label>Offer amount to send</label><input id='amount' type='number' min='1' value='" + (l.offerAmount || "") + "' placeholder='e.g. 250' />" +
        "<p class='muted'>Type the dollar amount, then tap Send offer. The customer sees it in chat on their tracking page.</p>" +
        "<label>Follow-up note (optional)</label><textarea id='note' rows='3' placeholder='Called, revised offer…'></textarea>" +
        "<div class='row'>" +
        "<button class='btn' id='sendOffer'>Send offer</button>" +
        "<button class='btn btn-ghost' id='save' type='button'>Save follow-up only</button>" +
        (l.email ? "<a class='btn btn-ghost' id='mailLetter' href='#'>Email offer letter</a>" : "") +
        "<a class='btn btn-ghost' href='" + letterHref + "' target='_blank' rel='noopener'>View letter</a>" +
        "<a class='btn btn-ghost' href='tel:" + String(l.phone).replace(/\D/g, "") + "'>Call seller</a></div>" +
        "<p class='muted' id='mailStatus'></p>" +
        "<h2 style='margin-top:1.4rem'>Keep or assign</h2>" +
        "<p class='muted'>Keep = Recarra buys. Assign = send a redacted sheet to one partner. Name, phone, and VIN stay locked until the assignment fee is marked paid.</p>" +
        "<label>This car</label>" +
        "<select id='intent'><option value='keep'" + ((l.keepOrAssign || "keep") === "keep" ? " selected" : "") + ">Keep — Recarra buys</option>" +
        "<option value='assign'" + (l.keepOrAssign === "assign" ? " selected" : "") + ">Assign — let go for a fee</option></select>" +
        "<label>Partner name</label><input id='partnerName' value='" + escapeHtml(l.assignedTo || "") + "' placeholder='Tower or buyer company' />" +
        "<label>Assignment fee due Recarra</label><input id='assignFee' type='number' min='0' value='" + (l.assignmentFee || "") + "' placeholder='e.g. 200' />" +
        "<p class='muted' id='assignStatus'>" +
          (l.assignmentPaidAt
            ? "Fee marked paid " + new Date(l.assignmentPaidAt).toLocaleDateString() + ". Full file can be released."
            : (l.keepOrAssign === "assign" ? "Redacted sheet only until you mark the fee paid." : "Not assigned.")) +
        "</p>" +
        "<div class='row'>" +
        "<button class='btn' id='saveAssign' type='button'>Save keep / assign</button>" +
        "<button class='btn btn-ghost' id='copyRedacted' type='button'>Copy redacted partner link</button>" +
        "<button class='btn btn-ghost' id='copyFull' type='button'>Mark fee paid + copy full file</button>" +
        "<a class='btn btn-ghost' id='openPartner' href='#' target='_blank' rel='noopener'>Open partner sheet</a>" +
        "</div>" +
        "<h2 style='margin-top:1.4rem'>Live seller chat</h2>" +
        "<div class='chat' id='chat'>" + msgs.map((m) =>
          "<div class='bubble " + m.from + "'><strong>" + (m.from === "recarra" ? "Recarra" : l.name) + "</strong><br>" +
          escapeHtml(m.text) + "</div>"
        ).join("") + "</div>" +
        "<label>Reply</label><textarea id='reply' rows='3'></textarea>" +
        "<div class='row'><button class='btn' id='send'>Send</button></div>";

      document.getElementById("save").onclick = () => {
        const status = document.getElementById("status").value;
        const amount = document.getElementById("amount").value;
        const note = document.getElementById("note").value.trim() || ("Status set to " + status + ".");
        const follow = { at: new Date().toISOString(), note, status };
        patch(l.id, {
          status,
          offerAmount: amount ? Number(amount) : l.offerAmount,
          followUps: [follow].concat(l.followUps || []),
        });
        render();
      };
      document.getElementById("sendOffer").onclick = () => {
        const amount = Number(document.getElementById("amount").value);
        if (!amount || amount < 1) {
          alert("Type the offer amount first.");
          return;
        }
        const now = new Date().toISOString();
        const extra = document.getElementById("note").value.trim();
        const text = "Recarra offer: $" + amount.toLocaleString() + ". This holds 7 days if the car, VIN, and title match. Not a locked payday until we inspect." + (extra ? " " + extra : "");
        const current = get(l.id);
        patch(l.id, {
          status: "Offer Sent",
          offerAmount: amount,
          offerSentAt: now,
          followUps: [{ at: now, note: extra || ("Offer sent $" + amount + "."), status: "Offer Sent" }].concat(current.followUps || []),
          messages: (current.messages || []).concat([{ id: "m-" + Date.now(), at: now, from: "recarra", text: text }])
        });
        sendOfferEmail(get(l.id), amount, href, letterHref);
        render();
      };
      const mailBtn = document.getElementById("mailLetter");
      if (mailBtn) {
        mailBtn.onclick = function (ev) {
          ev.preventDefault();
          const amount = Number(document.getElementById("amount").value) || l.offerAmount;
          if (!amount) { alert("Type the offer amount first."); return; }
          window.location.href = mailtoOffer(l, amount, href, letterHref);
        };
      }
      document.getElementById("send").onclick = () => {
        const text = document.getElementById("reply").value.trim();
        if (!text) return;
        const msg = { id: "m-" + Date.now(), at: new Date().toISOString(), from: "recarra", text };
        patch(l.id, { messages: (get(l.id).messages || []).concat(msg) });
        render();
      };
      document.getElementById("saveAssign").onclick = function () {
        const intent = document.getElementById("intent").value;
        const partner = document.getElementById("partnerName").value.trim();
        const fee = Number(document.getElementById("assignFee").value);
        if (intent === "assign" && (!partner || !(fee > 0))) {
          alert("For assign: add partner name and assignment fee.");
          return;
        }
        const now = new Date().toISOString();
        patch(l.id, {
          keepOrAssign: intent,
          assignedTo: intent === "assign" ? partner : "",
          assignmentFee: intent === "assign" ? fee : 0,
          assignedAt: intent === "assign" ? now : "",
          assignmentPaidAt: intent === "keep" ? "" : l.assignmentPaidAt,
          followUps: [{ at: now, note: intent === "assign" ? ("Assigned to " + partner + " for $" + fee) : "Marked keep — Recarra buys.", status: l.status }].concat(l.followUps || [])
        });
        render();
      };
      document.getElementById("copyRedacted").onclick = function () {
        const next = currentAssign(l);
        if (next.keepOrAssign !== "assign") { alert("Set this car to Assign and save first."); return; }
        copyText(partnerHref(next, false));
        document.getElementById("assignStatus").textContent = "Redacted link copied. Partner does not get name, phone, or VIN.";
      };
      document.getElementById("copyFull").onclick = function () {
        const next = currentAssign(l);
        if (next.keepOrAssign !== "assign") { alert("Set this car to Assign and save first."); return; }
        const now = new Date().toISOString();
        patch(l.id, { assignmentPaidAt: now, followUps: [{ at: now, note: "Assignment fee paid. Seller file released to " + (next.assignedTo || "partner") + ".", status: l.status }].concat(get(l.id).followUps || []) });
        copyText(partnerHref(Object.assign({}, get(l.id), { assignmentPaidAt: now }), true));
        document.getElementById("assignStatus").textContent = "Fee marked paid. Full file link copied — send only to that partner.";
      };
      document.getElementById("openPartner").onclick = function (ev) {
        ev.preventDefault();
        const next = currentAssign(l);
        window.open(partnerHref(next, !!next.assignmentPaidAt), "_blank", "noopener");
      };
    }

    function currentAssign(l) {
      return Object.assign({}, l, {
        keepOrAssign: document.getElementById("intent").value,
        assignedTo: document.getElementById("partnerName").value.trim(),
        assignmentFee: Number(document.getElementById("assignFee").value) || 0
      });
    }
    function encodePack(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    function partnerHref(lead, released) {
      const root = location.origin + location.pathname.replace(/[^/]+$/, "");
      const hold = lead.offerSentAt
        ? new Date(new Date(lead.offerSentAt).getTime() + 7 * 86400000).toLocaleDateString()
        : "7 days from send";
      const pack = {
        v: 1,
        no: lead.trackCode || lead.id,
        vehicle: lead.year + " " + lead.make + " " + lead.model,
        zip: lead.zip,
        running: lead.running,
        title: lead.title,
        offer: lead.offerAmount || null,
        range: [lead.offerLow, lead.offerHigh],
        fee: Number(lead.assignmentFee) || 0,
        partner: lead.assignedTo || "",
        hold: hold,
        released: !!released
      };
      if (released) {
        pack.name = lead.name;
        pack.phone = lead.phone;
        pack.email = lead.email || "";
        pack.vin = lead.vin || "";
      }
      return root + "partner.html#" + encodePack(pack);
    }
    function copyText(text) {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      else window.prompt("Copy this link", text);
    }

    function mailtoOffer(lead, amount, trackHref, letterHref) {
      const vehicle = lead.year + " " + lead.make + " " + lead.model;
      const no = lead.trackCode || lead.id;
      const subject = "Recarra LLC offer letter " + no + " — " + vehicle;
      const body =
        "Hi " + lead.name + ",\n\n" +
        "Recarra LLC offer letter " + no + " for your " + vehicle + ": $" + Number(amount).toLocaleString() + ".\n\n" +
        "This holds 7 days if the car, VIN, and title match.\n" +
        "Accepting is not a payday. We still inspect and verify identity before payment.\n\n" +
        "Official letter:\n" + letterHref + "\n\n" +
        "Accept or decline:\n" + trackHref + "\n\n" +
        "Recarra LLC\nGreater Houston, Texas\n(346) 274-0071\noffers@recarra.com\n";
      return "mailto:" + encodeURIComponent(lead.email) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    }
    function sendOfferEmail(lead, amount, trackHref, letterHref) {
      const status = document.getElementById("mailStatus");
      const vehicle = lead.year + " " + lead.make + " " + lead.model;
      const no = lead.trackCode || lead.id;
      const payload = {
        _subject: "Recarra LLC offer letter " + no + " — " + vehicle,
        _template: "box",
        _captcha: "false",
        company: "Recarra LLC",
        offer_number: no,
        name: lead.name,
        vehicle: vehicle,
        offer: "$" + Number(amount).toLocaleString(),
        holds: "7 days if the car, VIN, and title match",
        offer_letter: letterHref,
        tracking_link: trackHref,
        note: "Open the Recarra LLC offer letter, then Accept or Decline. Payment is after we inspect and verify. Not a locked payday.",
        recarra_phone: "(346) 274-0071"
      };
      const posts = [
        fetch("https://formsubmit.co/ajax/offers@recarra.com", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(Object.assign({ _subject: "COPY: offer sent " + lead.id }, payload))
        }).catch(function () {})
      ];
      if (lead.email && lead.email.indexOf("@") !== -1) {
        posts.push(fetch("https://formsubmit.co/ajax/" + encodeURIComponent(lead.email), {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(payload)
        }).catch(function () {}));
        if (status) status.textContent = "Offer posted to chat. Offer letter emailed to " + lead.email + " and copied to offers@recarra.com.";
      } else if (status) {
        status.textContent = "Offer posted to chat. No customer email on file — they accept on the tracking page, or tap Call seller.";
      }
      return Promise.all(posts);
    }
    function escapeHtml(s) {
      var el = document.createElement("span");
      el.textContent = String(s);
      return el.innerHTML;
    }
    function render() { renderList(); renderDetail(); }
    document.getElementById("deskSearch").addEventListener("input", function (e) {
      filter = e.target.value;
      renderList();
    });
    window.addEventListener("storage", (e) => { if (e.key === KEY) render(); });
    setInterval(renderList, 4000);
    render();
  </script>
</body>
</html>
