<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Track your Recarra offer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0e1c2f; --fg:#142033; --muted:#5b6b7c; --bg:#f4f6f8; --accent:#168a46; --border:#d7dee6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
    header { background:var(--navy); color:#fff; padding:0.9rem 1.25rem; font-weight:700; }
    header a { color:#fff; text-decoration:none; }
    .wrap { max-width:640px; margin:0 auto; padding:1.5rem 1.25rem 3rem; }
    .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin-top:1rem; }
    .muted { color:var(--muted); }
    h1 { letter-spacing:-0.03em; margin:0.2rem 0 0.6rem; }
    .btn { display:inline-flex; min-height:44px; align-items:center; padding:0.6rem 1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; cursor:pointer; font:inherit; }
    .btn-ghost { background:#fff; color:var(--fg); border:1px solid var(--border); }
    .btn-decline { background:#fff; color:#b42318; border:1px solid #f0c9c5; }
    label { display:block; font-size:0.78rem; font-weight:700; margin:0.7rem 0 0.3rem; }
    textarea { width:100%; min-height:88px; padding:0.6rem 0.75rem; border:1px solid var(--border); border-radius:8px; font:inherit; }
    .chat { max-height:280px; overflow:auto; display:flex; flex-direction:column; gap:0.45rem; }
    .bubble { padding:0.55rem 0.7rem; border-radius:8px; background:#fff; border:1px solid var(--border); max-width:90%; }
    .bubble.recarra { background:var(--navy); color:#fff; border:0; margin-left:auto; }
    .row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1rem; }
    .cash {
      display: inline-block;
      margin: 0.15rem 0 0.6rem;
      padding: 0.55rem 0.85rem;
      border-radius: 10px;
      background: #e8f6ee;
      color: #168a46;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .cash-label { margin: 0.4rem 0 0.15rem; font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .offer-no { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; }
    .hold { font-weight: 700; color: #168a46; }
    .hold.expired { color: #b42318; }
    .find-box { display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:1rem; }
    .find-box input { flex:1 1 180px; min-height:44px; padding:0.6rem 0.75rem; border:1px solid var(--border); border-radius:8px; font:inherit; }
  </style>
<script src="cloud.js"></script>
</head>
<body>
  <header><a href="./">Recarra</a></header>
  <div class="wrap" id="app">
    <p class="muted">Loading your live offer…</p>
  </div>
  <script>
    const KEY = "recarra-leads-v1";
    const CLOSED = ["Buyer Paid", "Completed", "Lost or Rejected"];
    const COPY = {
      "New Lead": "We have your request. A teammate is reviewing it.",
      Contacted: "Recarra has reached out. Reply here if we missed you.",
      "Vehicle Information Needed": "We need a bit more on the car or title.",
      "Offer Calculated": "We are pricing the car from what you sent.",
      "Offer Sent": "An offer is on this file. It holds 7 days if the car matches.",
      Negotiating: "We are working the number with you.",
      "Offer Accepted": "You accepted. We will confirm pickup next.",
      "Pickup Scheduled": "Pickup is on the calendar.",
      "Vehicle Collected": "The truck has the car. Payment follows verification.",
      "Buyer Paid": "Paid. This file is closing.",
      Completed: "This deal is closed.",
      "Lost or Rejected": "This request is closed. You can start a new car anytime."
    };
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
      catch (err) { return []; }
    }
    function save(leads) { localStorage.setItem(KEY, JSON.stringify(leads)); }
    function money(n) { return "$" + Number(n || 0).toLocaleString(); }
    function query() {
      const p = new URLSearchParams(location.search);
      return p.get("code") || p.get("q") || localStorage.getItem("recarra-open-track-v1") || "";
    }
    function findLeadByQuery(raw, items) {
      raw = String(raw || "").trim();
      if (!raw) return null;
      const digits = raw.replace(/\D/g, "");
      const upper = raw.toUpperCase().replace(/\s+/g, "");
      const rc = upper.indexOf("RC") === 0
        ? "RC-" + upper.replace(/^RC-?/, "")
        : (digits.length === 4 ? "RC-" + digits : upper);
      const exact = items.find(function (l) {
        const id = String(l.id || "").toUpperCase();
        const code = String(l.trackCode || "").toUpperCase();
        return id === rc || code === rc || id === upper || code === upper;
      });
      if (exact) return exact;
      if (digits.length === 4) {
        const suffix = items.filter(function (l) {
          return String(l.id || "").endsWith(digits) || String(l.trackCode || "").endsWith(digits);
        });
        if (suffix.length === 1) return suffix[0];
      }
      if (digits.length >= 7) {
        const byPhone = items.filter(function (l) {
          return String(l.phone || "").replace(/\D/g, "").endsWith(digits);
        });
        if (byPhone.length) return byPhone[0];
      }
      return null;
    }
    function find() {
      return findLeadByQuery(query(), load());
    }
    function expiresAt(l) {
      if (!l.offerSentAt) return null;
      return new Date(new Date(l.offerSentAt).getTime() + 7 * 24 * 60 * 60 * 1000);
    }
    function escapeHtml(s) {
      var el = document.createElement("span");
      el.textContent = String(s);
      return el.innerHTML;
    }
    var lastStamp = "";
    function draw(force) {
      var typing = document.activeElement && document.activeElement.id === "msg";
      var l = find();
      var stamp = l ? (l.status + "|" + (l.messages || []).length + "|" + (l.offerAmount || "") + "|" + (l.phone || "")) : "none";
      if (!force && typing && stamp === lastStamp) return;
      if (!force && stamp === lastStamp && document.getElementById("chat")) return;
      lastStamp = stamp;
      var app = document.getElementById("app");
      if (!l) {
        app.innerHTML =
          "<p class='n' style='font-size:0.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#168a46'>Find my offer</p>" +
          "<h1>Look up your 7-day offer</h1>" +
          "<p class='muted'>Type your offer number (RC-4821) or the phone you used on the form.</p>" +
          "<form class='find-box' id='lookup'><input id='q' placeholder='RC-4821 or your phone' value='" + escapeHtml(query()) + "' /><button class='btn' type='submit'>Find my offer</button></form>" +
          (query() ? "<p class='muted' style='color:#b42318;margin-top:0.7rem'>No offer matched. Use the same phone you submitted with.</p>" : "") +
          "<p class='row'><a class='btn btn-ghost' href='aia_offer_form_enhanced_ux_boosted.html'>Submit a new car</a></p>";
        document.getElementById("lookup").onsubmit = function (ev) {
          ev.preventDefault();
          var next = document.getElementById("q").value.trim();
          location.href = "track.html?q=" + encodeURIComponent(next);
        };
        return;
      }
      var offerNo = l.trackCode || l.id;
      try { localStorage.setItem("recarra-open-track-v1", offerNo); } catch (err) {}
      var exp = expiresAt(l);
      var expired = exp && Date.now() > exp.getTime();
      var hold = "";
      if (exp) {
        hold = "<p class='hold" + (expired ? " expired" : "") + "'>" +
          (expired
            ? "This 7-day offer expired on " + exp.toLocaleDateString() + ". Submit a new request."
            : "Holds until " + exp.toLocaleDateString() + " (7 days from when Recarra sent it).") +
          "</p>";
      } else {
        hold = "<p class='muted'>The 7-day clock starts when Recarra sends your offer.</p>";
      }
      var closed = CLOSED.indexOf(l.status) !== -1;
      var href = location.href;
      var msgs = l.messages || [];
      var range = money(l.offerAmount || l.offerLow) + (l.offerAmount ? "" : "–" + money(l.offerHigh));
      var cashLabel = l.offerAmount ? "Your Recarra offer" : "Starting range";
      var waiting = l.offerAmount && (l.status === "Offer Sent" || l.status === "Negotiating") && !expired;
      var letter = "";
      if (l.offerAmount && waiting) {
        letter =
          "<div class='card' id='letter' style='border-color:#0e1c2f'>" +
          "<p class='cash-label'>Recarra LLC offer letter</p>" +
          "<p style='font-family:Georgia,serif;font-size:1.1rem;margin:0.2rem 0 0.6rem'>Vehicle purchase offer · " + escapeHtml(offerNo) + "</p>" +
          "<p>Recarra LLC offers <strong class='cash' style='display:inline;font-size:1.35rem;padding:0;background:transparent'>" + money(l.offerAmount) + "</strong> for this " + escapeHtml(l.year + " " + l.make + " " + l.model) + " if the car, VIN, and title match.</p>" +
          "<p class='muted'>Official letter from Recarra LLC, Houston, Texas. Holds 7 days. Accepting is not a payday — we still inspect and verify identity before payment.</p>" +
          "<div class='row'><a class='btn' href='letter.html?code=" + encodeURIComponent(offerNo) + "'>Open offer letter</a>" +
          "<button class='btn' id='accept' type='button'>Accept offer</button>" +
          "<button class='btn btn-decline' id='decline' type='button'>Decline offer</button></div></div>";
      } else if (expired && l.offerAmount) {
        letter = "<div class='card'><p><strong>This 7-day Recarra LLC offer expired.</strong></p><p class='muted'>Request a new one if you still want to sell the car.</p><p class='row'><a class='btn btn-ghost' href='letter.html?code=" + encodeURIComponent(offerNo) + "'>View expired letter</a></p></div>";
      } else if (l.status === "Offer Accepted") {
        letter = "<div class='card'><p><strong>You accepted Recarra LLC offer " + money(l.offerAmount) + ".</strong></p><p class='muted'>Next we schedule pickup. Payment is after we verify the vehicle, title, and identity.</p><p class='row'><a class='btn' href='letter.html?code=" + encodeURIComponent(offerNo) + "'>View offer letter</a></p></div>";
      } else if (l.status === "Lost or Rejected") {
        letter = "<div class='card'><p><strong>You declined this Recarra LLC offer.</strong></p><p class='muted'>No problem. You can submit a different car anytime.</p></div>";
      } else {
        letter = "<div class='card'><p class='muted'>Your Recarra LLC offer letter appears here after we send a dollar amount. Offer number <strong>" + escapeHtml(offerNo) + "</strong>.</p></div>";
      }
      var chat = msgs.map(function (m) {
        return "<div class='bubble " + m.from + "'><strong>" + (m.from === "recarra" ? "Recarra" : escapeHtml(l.name)) + "</strong><br>" + escapeHtml(m.text) + "</div>";
      }).join("");
      var actions = closed
        ? "<a class='btn' href='./'>Back to Recarra</a><a class='btn btn-ghost' href='aia_offer_form_enhanced_ux_boosted.html'>Submit a new car</a>"
        : "<a class='btn btn-ghost' href='aia_offer_form_enhanced_ux_boosted.html'>Submit a different car</a>";
      app.innerHTML =
        "<p class='muted'>Live offer</p>" +
        "<p class='offer-no'>Offer " + escapeHtml(offerNo) + "</p>" +
        "<h1>" + escapeHtml(l.year + " " + l.make + " " + l.model) + "</h1>" +
        "<p>" + escapeHtml(COPY[l.status] || l.status) + "</p>" +
        hold +
        "<p class='cash-label'>" + cashLabel + "</p>" +
        "<p class='cash'>" + range + "</p>" +
        letter +
        "<div class='card'><p><strong>Chat with Recarra</strong></p><div class='chat' id='chat'>" + chat + "</div>" +
        "<label for='msg'>Message</label><textarea id='msg' rows='3' placeholder='Ask about pickup, title, or the number…'></textarea>" +
        "<div class='row'><button class='btn' id='send' type='button'>Send</button></div></div>" +
        "<div class='card'><p><strong>Your tracking address</strong></p><p class='muted' style='word-break:break-all'>" + escapeHtml(href) + "</p>" +
        "<button class='btn btn-ghost' id='copy' type='button'>Copy link</button></div>" +
        "<div class='row'>" + actions + "</div>";
      var box = document.getElementById("chat");
      if (box) box.scrollTop = box.scrollHeight;
      document.getElementById("copy").onclick = function () {
        if (navigator.clipboard) navigator.clipboard.writeText(href);
      };
      document.getElementById("send").onclick = function () {
        var text = document.getElementById("msg").value.trim();
        if (!text) return;
        var msg = { id: "m-" + Date.now(), at: new Date().toISOString(), from: "customer", text: text };
        save(load().map(function (item) {
          if (item.id !== l.id) return item;
          return Object.assign({}, item, { messages: (item.messages || []).concat([msg]) });
        }));
        lastStamp = "";
        draw(true);
      };
      var accept = document.getElementById("accept");
      var decline = document.getElementById("decline");
      if (accept) accept.onclick = function () { decide("Offer Accepted", "I accept the Recarra offer of " + money(l.offerAmount) + "."); };
      if (decline) decline.onclick = function () {
        if (!window.confirm("Decline this Recarra offer?")) return;
        decide("Lost or Rejected", "I decline this offer.");
      };
    }
    function decide(status, customerText) {
      var l = find();
      if (!l) return;
      var now = new Date().toISOString();
      var recarra = status === "Offer Accepted"
        ? "You accepted. We will confirm pickup next. Payment is after we verify VIN, title, and identity."
        : "Offer declined. This file is closed. Submit a new car anytime.";
      save(load().map(function (item) {
        if (item.id !== l.id) return item;
        return Object.assign({}, item, {
          status: status,
          followUps: [{ at: now, note: customerText, status: status }].concat(item.followUps || []),
          messages: (item.messages || []).concat([
            { id: "m-" + Date.now(), at: now, from: "customer", text: customerText },
            { id: "m-" + (Date.now() + 1), at: now, from: "recarra", text: recarra }
          ])
        });
      }));
      lastStamp = "";
      draw(true);
    }
    window.addEventListener("storage", function () { lastStamp = ""; draw(true); });
    setInterval(function () { draw(false); }, 2000);
    draw(true);
  
    (function hydrateFromCloud() {
      var q = (typeof query === "function" ? query() : "");
      if (!q || !window.recarraFindOffer) return;
      var local = (typeof load === "function" ? load() : []);
      if (typeof findLeadByQuery === "function" && findLeadByQuery(q, local)) return;
      window.recarraFindOffer(q).then(function (lead) {
        if (!lead || !lead.id) return;
        var rows = load().filter(function (l) { return l.id !== lead.id; });
        rows.unshift(lead);
        save(rows);
        if (typeof draw === "function") draw(true);
      });
    })();
</script>
</body>
</html>
